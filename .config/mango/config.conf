# Temporary Defaults
# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
idle_inhibit_when_fullscreen=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_direction_only_zone_overlap=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
float_full_to_top=0
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=4



# Source Subfiles Here
source=./main/animations.conf
source=./main/keybinds.conf
source=./main/monitors.conf
source=./main/windowrules.conf

exec_once=noctalia

# env=QT_QPA_PLATFORMTHEME,gtk3
# env=QT_QPA_PLATFORMTHEME_QT6,gtk3
env=QT_QPA_PLATFORMTHEME,qt6ct
# env=QT_QPA_PLATFORM=wayland
env=XDG_MENU_PREFIX,mango-

# This sources the noctalia theme




source=~/.config/mango/noctalia.conf
