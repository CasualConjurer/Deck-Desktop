# Main Configuration Files

## Settings
### System and Hardware
xwayland_persistence=1
xwayland_ignore_scale=0
sync_obj_enable=1                           
allow_lock_transparent=0
allow_shortcuts_inhibit=1
auto_reload_config=1

### Focus and Input
focus_on_activate=1
sloppy_focus=1
warp_cursor=1
cursor_hide_timeout=60
cursor_hide_on_keypress=0

### Monitor and Tags
view_current_to_back=1
single_scratchpad=0

### Window Behavior
no_border_when_single=0
smart_gaps=0


## Controls
### Keyboard
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=us

## Mouse - Need Relogin
mouse_natural_scrolling=0

## Trackpad - Need Relogin
disable_trackpad=1                          # 0 for enable 
# tap_to_click=1
# tap_and_drag=1
# drag_lock=1
# trackpad_natural_scrolling=0
# trackpad_disable_while_typing=1
# trackpad_left_handed=0
# trackpad_middle_button_emulation=0
# swipe_min_threshold=1

## Touchscreen
touch_enable=1                              # Enable Touchscreen


# Source Subfiles Here
source=./main/appearance.conf
source=./main/keybinds.conf
source=./main/monitors.conf
source=./main/windowrules.conf

exec_once=noctalia

# env=QT_QPA_PLATFORMTHEME,gtk3
# env=QT_QPA_PLATFORMTHEME_QT6,gtk3
env=QT_QPA_PLATFORMTHEME,qt6ct
# env=QT_QPA_PLATFORM=wayland
env=XDG_MENU_PREFIX,mango-

# This sources the noctalia theme

source=~/.config/mango/noctalia.conf
