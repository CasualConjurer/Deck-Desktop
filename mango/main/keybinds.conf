# KEYBINDS CONFIGURATION

# Global Keybinds
keymode=common
bind=SUPER+SHIFT,r,reload_config

# Default Keybinds - standard windows
keymode=default
bind=SUPER,q,killclient
bind=SUPER,return,toggle_named_scratchpad,none,kitty-main,kitty -T kitty-main # Terminal
bind=SUPER+SHIFT,return,spawn,kitty
bind=SUPER,e,toggle_named_scratchpad,dolphin,none,dolphin # File Manager
bind=SUPER,n,toggle_named_scratchpad,obsidian,none,obsidian # Notes App
bind=SUPER,f,togglemaximizescreen
bind=SUPER+SHIFT,f,togglefullscreen
bind=SUPER,t,togglefloating


mousebind=SUPER,btn_side,spawn_shell,notify-send -a Sample -u low "Sample"
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# bind=SUPER,u,toggle_named_scratchpad,none,SISR,none

# Noctalia Specific
bind=SUPER,a,spawn,noctalia msg panel-toggle launcher
bind=SUPER,o,spawn,noctalia msg panel-toggle control-center
bind=SUPER,comma,spawn,noctalia msg settings-toggle
bind=SUPER,p,spawn,noctalia msg screenshot-region
bind=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bind=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down



bind=SUPER,g,togglegaps
bind=SUPER,r,spawn_shell,mmsg dispatch setkeymode,resize | notify-send -a Mango -u low "Resize mode"

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

bind=SUPER,page_up,viewtoleft
bind=SUPER,page_down,viewtoright
bind=SUPER+SHIFT,page_up,tagtoleft
bind=SUPER+SHIFT,page_down,tagtoright

bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

bind=SUPER+SHIFT,TAB,focusstack,next
bind=SUPER,TAB,focuslast

bind=SUPER,s,toggle_scratchpad
bind=SUPER+SHIFT,s,minimized
bind=SUPER+CTRL,s,restore_minimized

bind=SUPER,left,focusdir,left
bind=SUPER,right,focusdir,right
bind=SUPER,up,focusdir,up
bind=SUPER,down,focusdir,down

bind=SUPER+SHIFT,left,exchange_client,left
bind=SUPER+SHIFT,right,exchange_client,right
bind=SUPER+SHIFT,up,exchange_client,up
bind=SUPER+SHIFT,down,exchange_client,down

# bind=SUPER,left,focus_window_or_workspace,left
# bind=SUPER,right,focus_window_or_workspace,right
# bind=SUPER,up,focus_window_or_workspace,up
# bind=SUPER,down,focus_window_or_workspace,down

# Game Mode Binds 
# keymode=gamer


# Resize Mode
keymode=resize
bind=none,left,movewin,-10,0
bind=none,right,movewin,+10,0
bind=none,up,movewin,0,-10
bind=none,down,movewin,0,+10
bind=NONE,ESCAPE,spawn_shell,mmsg dispatch setkeymode,default | notify-send -a Mango -u low "Default mode"
bind=SUPER,r,spawn_shell,mmsg dispatch setkeymode,default | notify-send -a Mango -u low "Default mode"
bind=SUPER+SHIFT,X,incgaps,1
bind=SUPER+SHIFT,Z,incgaps,-1

